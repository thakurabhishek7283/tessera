name: Release

# Runs only after the CI workflow (lint, typecheck, unit/browser/e2e tests, build, size) has
# passed for a push to main, and releases exactly the commit CI tested.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history and tags: release-tags.mjs finds the commit that set each version.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Without NPM_TOKEN there is no publish script, so this only opens or updates the
      # "Version Packages" pull request; the next step makes sure that never hides a release.
      - id: changesets
        uses: changesets/action@v2
        with:
          version: pnpm changeset version
          publish: ${{ env.HAS_NPM_TOKEN == 'true' && 'pnpm changeset publish' || '' }}
          # Releases are git tags only (see the next step), not GitHub Releases.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Tags each released version as <package>@<version> on the commit that set it (the merged
      # "Version Packages" commit), whether or not it was published. Already-tagged versions are
      # skipped, so this is a no-op on every other push. Only when no changesets are pending:
      # otherwise the step above has just checked out the unmerged version-bump commit.
      - name: Tag released versions
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/release-tags.mjs --since v0.1.0 --push
      - name: Fail if versions are waiting to publish but NPM_TOKEN is missing
        if: env.HAS_NPM_TOKEN != 'true' && steps.changesets.outputs.hasChangesets == 'false'
        run: |
          missing=()
          for manifest in packages/*/package.json; do
            [ "$(node -p "require('./$manifest').private === true")" = "true" ] && continue
            spec=$(node -p "const p = require('./$manifest'); p.name + '@' + p.version")
            npm view "$spec" version > /dev/null 2>&1 || missing+=("$spec")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::NPM_TOKEN is not set, so these versions were not published: ${missing[*]}"
            exit 1
          fi
          echo "Every package version is already on npm; nothing to publish."
      - name: Summarise published packages
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          echo "### Published to npm" >> "$GITHUB_STEP_SUMMARY"
          node -e 'for (const p of JSON.parse(process.env.PUBLISHED)) console.log(`- \`${p.name}@${p.version}\``)' >> "$GITHUB_STEP_SUMMARY"
