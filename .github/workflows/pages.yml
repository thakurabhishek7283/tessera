name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm docs:gen
      - name: Build the docs and the playground
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
          BASE_PATH: /${{ github.event.repository.name }}/playground/
        run: |
          pnpm --filter docs build
          pnpm --filter playground build
          mkdir -p site
          cp -R apps/docs/.vitepress/dist/. site/
          mkdir -p site/playground
          cp -R apps/playground/dist/. site/playground/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
